name: Sync Upstream (totally not vibecoded)

on:
  schedule:
    - cron: '*/30 * * * *' # daily at midnight UTC

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync with upstream
        run: |
          git remote | grep upstream || git remote add upstream https://github.com/PenguinMod/PenguinMod-Vm.git
          git fetch upstream
          git checkout main
          git merge --ff-only upstream/main || echo "No changes to merge"
          git push origin main
